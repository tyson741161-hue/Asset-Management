name: Run Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: asset_management_test
          POSTGRES_USER: asset_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql://asset_admin:test_password@localhost:5432/asset_management_test" >> $GITHUB_ENV
      
      - name: Initialize database
        run: |
          python init_db.py
      
      - name: Run tests
        run: |
          python test_migration.py
      
      - name: Check setup
        run: |
          python check_setup.py
      
      - name: Test summary
        if: always()
        run: |
          echo "✅ Tests completed"
