name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub (Optional)
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd /home/${{ secrets.SERVER_USERNAME }}/asset-management || mkdir -p /home/${{ secrets.SERVER_USERNAME }}/asset-management && cd /home/${{ secrets.SERVER_USERNAME }}/asset-management
            
            # Pull latest code
            if [ -d .git ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }} .
            fi
            
            # Stop existing containers
            docker-compose down
            
            # Pull latest images and start
            docker-compose pull
            docker-compose up -d --build
            
            # Show status
            docker-compose ps
            
            # Show logs
            docker-compose logs --tail=50
      
      - name: Health Check
        run: |
          echo "Waiting for application to start..."
          sleep 30
          
          # Check if application is responding (optional)
          # curl -f http://${{ secrets.SERVER_HOST }}:5000 || exit 1
      
      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Application URL: http://${{ secrets.SERVER_HOST }}:5000"
      
      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs above for details"
