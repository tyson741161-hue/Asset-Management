version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: asset-management-db
    environment:
      - POSTGRES_DB=asset_management
      - POSTGRES_USER=asset_admin
      - POSTGRES_PASSWORD=asset_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - asset-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_admin -d asset_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  asset-management:
    build: .
    container_name: asset-management-system
    ports:
      - "5000:5000"
    volumes:
      # Keep JSON files for backup/migration purposes
      - ./assets_data.json:/app/assets_data.json
      - ./tickets_data.json:/app/tickets_data.json
      - ./requests_data.json:/app/requests_data.json
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://asset_admin:asset_secure_pass_2026@postgres:5432/asset_management
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asset-network

volumes:
  postgres_data:

networks:
  asset-network:
    driver: bridge
